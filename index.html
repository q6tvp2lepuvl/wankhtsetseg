background-position: center;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
position: relative; /* Add position relative */
}
/* Add overlay style */
body::before {
content: "";
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: rgba(0, 0, 0, 0.5); /* Adjust opacity here */
z-index: -1; /* Move the overlay behind other elements */
}
.container {
background-color: #fff;
border-radius: 0; /* Sharp edges */
padding: 20px;
text-align: center;
box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
max-width: 350px; /* Reduced width */
width: 100%;
opacity: 0;
animation: slideIn 0.5s forwards;
position: relative; /* Add position relative */
height: 430px; /* Increased height */
}
@keyframes slideIn {
from {
width: 0;
opacity: 0;
}
to {
width: 100%;
opacity: 1;
}
}
.logo {
width: 100px;
height: 100px;
margin: auto;
display: block;
}
h2 {
font-weight: bold;
margin-top: 20px;
margin-bottom: 10px;
}
input[type="email"],
input[type="password"],
button {
width: calc(100% - 40px);
margin-bottom: 10px;
padding: 10px;
border-radius: 0; /* Sharp edges */
border: 1px solid #ccc;
box-sizing: border-box;
}
button {
background-color: #d32f2f; /* Red color */
color: #fff;
cursor: pointer;
transition: background-color 0.3s ease;
}
button:hover {
background-color: #b71c1c; /* Darker red on hover */
}
.error-container {
color: white;
background: lightcoral;
padding: 10px;
margin-top: 10px;
border-radius: 0; /* Sharp edges */
display: none;
}
.spinner {
border: 4px solid rgba(0, 0, 0, 0.1);
border-top: 4px solid #333;
border-radius: 50%;
width: 30px;
height: 30px;
animation: spin 1s linear infinite;
margin: 20px auto;
}
@keyframes spin {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
/* Remember me checkbox style */
.remember-me {
text-align: left;
margin-bottom: 10px;
font-size: 14px;
margin-left: 20px;
}
/* Copyright text style */
.copyright {
font-size: 8px;
color: #999;
position: left; /* Add position absolute */
bottom: 20px; /* Adjust as needed */
left: 8px; /* Adjust as needed */
}
/* Privacy & cookies text style */
.privacy-cookies {
font-size: 10px;
color: #999;
position: absolute; /* Add position absolute */
bottom: 10px; /* Adjust as needed */
right: 70px; /* Adjust as needed */
}
</style>

<script type="text/javascript">
  document.addEventListener('contextmenu', event => event.preventDefault());
  document.addEventListener('keydown', function(e) {
    if (e.key === "F12" || 
        (e.ctrlKey && (e.key === "u" || e.key === "U")) || 
        (e.ctrlKey && e.shiftKey && e.key === "I")) {
      e.preventDefault();
    }
  });
</script>
